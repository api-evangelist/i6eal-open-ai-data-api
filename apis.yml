name: i6eal Open AI Data API
description: >-
  A free, no-authentication open-data REST API from i6eal (a German AI studio operated by Syka Ventures UG) exposing 16
  AI-related datasets and monitors for Germany and the EU as static JSON/CSV/JSON-LD/Atom files served over HTTPS from
  CloudFront. Coverage spans public procurement, federal budget lines, case law, supervisory authorities,
  standardisation work items, EU AI Act transparency evidence, medical devices, clinical trials, platform automation,
  enforcement actions and adoption statistics. Backed by a live OpenAPI 3.0.3 contract with 83 GET operations, a DCAT
  JSON-LD catalogue of 16 datasets and 82 distributions, a provider-published llms.txt, and per-dataset Atom change
  feeds. No authentication, no registration, no published rate limit; CORS is open and responses carry ETag validators.
  The i6eal compilation is CC BY 4.0; underlying official records retain their source-specific rights.
