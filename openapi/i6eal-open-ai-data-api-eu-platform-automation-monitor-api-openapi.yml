  /data/plattformautomationsmonitor/feed.atom:
    get:
      tags:
      - EU Platform Automation Monitor
      operationId: getEuPlatformAutomationMonitorFeed
      summary: Change feed — EU Platform Automation Monitor
      description: 'Monthly DSA statements on automated detection, decision automation and reported restrictions by platform; automation is not relabelled as AI.


        Attribution: i6eal analysis of the European Commission DSA Transparency Database monthly aggregated-simple data.


        Reuse: The DSA Transparency Database is licensed under CC BY 4.0. The i6eal compilation attributes the European Commission and documents each transformation.'
      responses:
        '200':
          description: Change feed of EU Platform Automation Monitor.
          content:
