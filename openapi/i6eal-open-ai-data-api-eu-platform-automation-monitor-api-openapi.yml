openapi: 3.2.0
info:
  title: i6eal Open AI Data EU Platform Automation Monitor API
  version: 1.0.0
  description: Open datasets on artificial intelligence in Germany and the EU — public procurement, federal budget lines, case law, supervision, standardisation, medical devices, enforcement and more.
  termsOfService: https://i6eal.de/tools/daten/
  contact:
    name: i6eal
    url: https://i6eal.de/kontakt/
    email: ai@i6eal.de
  license:
    name: CC BY 4.0 — i6eal compilation only; source records retain source-specific rights
    url: https://i6eal.de/tools/daten/
  x-logo:
    url: https://i6eal.de/publisher-logo.png
    altText: i6eal
servers:
- url: https://i6eal.de
  description: Production — static files behind CloudFront
security: []
tags:
- name: EU Platform Automation Monitor
  description: Monthly DSA statements on automated detection, decision automation and reported restrictions by platform; automation is not relabelled as AI.
  externalDocs:
    description: Dataset documentation and methodology
    url: https://i6eal.de/tools/plattformautomationsmonitor/
paths:
  /data/plattformautomationsmonitor/index.json:
    get:
      tags:
      - EU Platform Automation Monitor
      operationId: getEuPlatformAutomationMonitorIndex
      summary: Full index — EU Platform Automation Monitor
      description: 'Monthly DSA statements on automated detection, decision automation and reported restrictions by platform; automation is not relabelled as AI.


        Attribution: i6eal analysis of the European Commission DSA Transparency Database monthly aggregated-simple data.


        Reuse: The DSA Transparency Database is licensed under CC BY 4.0. The i6eal compilation attributes the European Commission and documents each transformation.'
      responses:
        '200':
          description: Full index of EU Platform Automation Monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetIndex'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/plattformautomationsmonitor/platforms.csv:
    get:
      tags:
      - EU Platform Automation Monitor
      operationId: getEuPlatformAutomationMonitorPlatforms
