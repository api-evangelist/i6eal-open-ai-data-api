security: []
tags:
- name: Observed AI Procurement Changes
  description: Revision trail for newly published and materially changed procedure dossiers; retrieval timestamps alone never create an event.
  externalDocs:
    description: Dataset documentation and methodology
    url: https://i6eal.de/ki-vergabe/
paths:
  /data/ki-auftragsaenderungen/index.json:
    get:
      tags:
      - Observed AI Procurement Changes
      operationId: getProcurementObservedChangesIndex
      summary: Change index — Observed AI Procurement Changes
      description: 'Revision trail for newly published and materially changed procedure dossiers; retrieval timestamps alone never create an event.


        Attribution: i6eal revision trail for the AI Procurement Chronicle.


        Reuse: The i6eal revision metadata is an original compilation; included procurement facts retain their original source terms.'
      responses:
        '200':
          description: Change index of Observed AI Procurement Changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetIndex'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-auftragsaenderungen/archive.json:
    get:
      tags:
      - Observed AI Procurement Changes
      operationId: getProcurementObservedChangesArchive
      summary: Revision archive — Observed AI Procurement Changes
      description: 'Revision trail for newly published and materially changed procedure dossiers; retrieval timestamps alone never create an event.


        Attribution: i6eal revision trail for the AI Procurement Chronicle.


        Reuse: The i6eal revision metadata is an original compilation; included procurement facts retain their original source terms.'
      responses:
        '200':
          description: Revision archive of Observed AI Procurement Changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResource'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-auftragsaenderungen/changes.csv:
    get:
      tags:
      - Observed AI Procurement Changes
      operationId: getProcurementObservedChangesChanges
      summary: Changes — Observed AI Procurement Changes
      description: 'Revision trail for newly published and materially changed procedure dossiers; retrieval timestamps alone never create an event.


        Attribution: i6eal revision trail for the AI Procurement Chronicle.


        Reuse: The i6eal revision metadata is an original compilation; included procurement facts retain their original source terms.'
      responses:
        '200':
          description: Changes of Observed AI Procurement Changes.
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/CsvTable'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-auftragsaenderungen/atom.xml:
    get:
      tags:
      - Observed AI Procurement Changes
      operationId: getProcurementObservedChangesAtom
      summary: Change feed — Observed AI Procurement Changes
      description: 'Revision trail for newly published and materially changed procedure dossiers; retrieval timestamps alone never create an event.


        Attribution: i6eal revision trail for the AI Procurement Chronicle.


        Reuse: The i6eal revision metadata is an original compilation; included procurement facts retain their original source terms.'
      responses:
        '200':
          description: Change feed of Observed AI Procurement Changes.
          content:
            application/atom+xml:
              schema:
                $ref: '#/components/schemas/AtomFeed'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-auftragsaenderungen/methodology.json:
    get:
      tags:
      - Observed AI Procurement Changes
      operationId: getProcurementObservedChangesMethodology
      summary: Methodology — Observed AI Procurement Changes
      description: 'Revision trail for newly published and materially changed procedure dossiers; retrieval timestamps alone never create an event.


        Attribution: i6eal revision trail for the AI Procurement Chronicle.


        Reuse: The i6eal revision metadata is an original compilation; included procurement facts retain their original source terms.'
      responses:
        '200':
          description: Methodology of Observed AI Procurement Changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResource'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: No distribution exists at this path.
  schemas:
    AtomFeed:
      type: string
      description: Atom 1.0 feed of observed changes to this dataset.
    DatasetResource:
      type: object
      description: A dataset-specific JSON document. See the dataset entry in the DCAT catalogue for its shape.
      additionalProperties: true
    CsvTable:
      type: string
      description: RFC 4180 CSV with a header row, UTF-8 encoded.
    DatasetIndex:
      type: object
      description: Every dataset index shares the envelope below. The remaining top-level keys are dataset-specific — consult the `methodology` block and the dataset entry in the DCAT catalogue.
      required:
      - schemaVersion
      properties:
        schemaVersion:
          description: Payload contract of this dataset. Changes only on a breaking shape change.
          oneOf:
          - type: string
          - type: integer
        generatedAt:
          type: string
          format: date-time
          description: When this projection was built.
        trackingSince:
          type: string
          description: Start of the i6eal observation period — distinct from the coverage of the underlying sources.
        methodology:
          type: object
          description: How the dataset is collected and what it does and does not claim.
        downloads:
          type: object
          additionalProperties:
            type: string
          description: Named paths of sibling distributions published with this dataset.
      additionalProperties: true
externalDocs:
  description: Open data hub, licensing and citation guidance
  url: https://i6eal.de/tools/daten/
