openapi: 3.2.0
info:
  title: i6eal Open AI Data EU AI Medical-Device Lifecycle Monitor…
  version: 1.0.0
  description: Open datasets on artificial intelligence in Germany and the EU — public procurement, federal budget lines, case law, supervision, standardisation, medical devices, enforcement and more.
  termsOfService: https://i6eal.de/tools/daten/
  contact:
    name: i6eal
    url: https://i6eal.de/kontakt/
    email: ai@i6eal.de
  license:
    name: CC BY 4.0 — i6eal compilation only; source records retain source-specific rights
    url: https://i6eal.de/tools/daten/
  x-logo:
    url: https://i6eal.de/publisher-logo.png
    altText: i6eal
servers:
- url: https://i6eal.de
  description: Production — static files behind CloudFront
security: []
tags:
- name: EU AI Medical-Device Lifecycle Monitor
  description: Exact AI text evidence from the public EUDAMED software corpus with manufacturer, risk, version and registry attributes; software alone is never treated as AI evidence.
  externalDocs:
    description: Dataset documentation and methodology
    url: https://i6eal.de/tools/ki-medizinproduktmonitor/
paths:
  /data/ki-medizinproduktmonitor/index.json:
    get:
      tags:
      - EU AI Medical-Device Lifecycle Monitor
      operationId: getEuAiMedicalDeviceLifecycleMonitorIndex
      summary: Full index — EU AI Medical-Device Lifecycle Monitor
      description: 'Exact AI text evidence from the public EUDAMED software corpus with manufacturer, risk, version and registry attributes; software alone is never treated as AI evidence.


        Attribution: i6eal analysis of the European Commission EUDAMED Public API with disclosed text-evidence and observation rules.


        Reuse: European Commission EUDAMED public data, transformed by i6eal. The Commission legal notice and source API terms govern reuse; no unqualified dataset-specific CC licence is asserted.'
      responses:
        '200':
          description: Full index of EU AI Medical-Device Lifecycle Monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetIndex'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-medizinproduktmonitor/devices.csv:
    get:
      tags:
      - EU AI Medical-Device Lifecycle Monitor
      operationId: getEuAiMedicalDeviceLifecycleMonitorDevices
