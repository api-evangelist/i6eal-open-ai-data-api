        Attribution: i6eal analysis of the European Commission EUDAMED Public API with disclosed text-evidence and observation rules.


        Reuse: European Commission EUDAMED public data, transformed by i6eal. The Commission legal notice and source API terms govern reuse; no unqualified dataset-specific CC licence is asserted.'
      responses:
        '200':
          description: Devices of EU AI Medical-Device Lifecycle Monitor.
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/CsvTable'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-medizinproduktmonitor/evidence.csv:
    get:
      tags:
      - EU AI Medical-Device Lifecycle Monitor
      operationId: getEuAiMedicalDeviceLifecycleMonitorEvidence
      summary: Text evidence — EU AI Medical-Device Lifecycle Monitor
      description: 'Exact AI text evidence from the public EUDAMED software corpus with manufacturer, risk, version and registry attributes; software alone is never treated as AI evidence.


        Attribution: i6eal analysis of the European Commission EUDAMED Public API with disclosed text-evidence and observation rules.


        Reuse: European Commission EUDAMED public data, transformed by i6eal. The Commission legal notice and source API terms govern reuse; no unqualified dataset-specific CC licence is asserted.'
      responses:
        '200':
          description: Text evidence of EU AI Medical-Device Lifecycle Monitor.
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/CsvTable'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-medizinproduktmonitor/events.csv:
    get:
      tags:
      - EU AI Medical-Device Lifecycle Monitor
      operationId: getEuAiMedicalDeviceLifecycleMonitorEvents
      summary: Lifecycle events — EU AI Medical-Device Lifecycle Monitor
      description: 'Exact AI text evidence from the public EUDAMED software corpus with manufacturer, risk, version and registry attributes; software alone is never treated as AI evidence.


        Attribution: i6eal analysis of the European Commission EUDAMED Public API with disclosed text-evidence and observation rules.


        Reuse: European Commission EUDAMED public data, transformed by i6eal. The Commission legal notice and source API terms govern reuse; no unqualified dataset-specific CC licence is asserted.'
      responses:
        '200':
          description: Lifecycle events of EU AI Medical-Device Lifecycle Monitor.
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/CsvTable'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-medizinproduktmonitor/methodology.json:
    get:
      tags:
      - EU AI Medical-Device Lifecycle Monitor
      operationId: getEuAiMedicalDeviceLifecycleMonitorMethodology
      summary: Methodology — EU AI Medical-Device Lifecycle Monitor
      description: 'Exact AI text evidence from the public EUDAMED software corpus with manufacturer, risk, version and registry attributes; software alone is never treated as AI evidence.


        Attribution: i6eal analysis of the European Commission EUDAMED Public API with disclosed text-evidence and observation rules.


        Reuse: European Commission EUDAMED public data, transformed by i6eal. The Commission legal notice and source API terms govern reuse; no unqualified dataset-specific CC licence is asserted.'
      responses:
        '200':
          description: Methodology of EU AI Medical-Device Lifecycle Monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResource'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    DatasetResource:
      type: object
      description: A dataset-specific JSON document. See the dataset entry in the DCAT catalogue for its shape.
      additionalProperties: true
    CsvTable:
      type: string
      description: RFC 4180 CSV with a header row, UTF-8 encoded.
    DatasetIndex:
      type: object
      description: Every dataset index shares the envelope below. The remaining top-level keys are dataset-specific — consult the `methodology` block and the dataset entry in the DCAT catalogue.
      required:
      - schemaVersion
      properties:
        schemaVersion:
          description: Payload contract of this dataset. Changes only on a breaking shape change.
          oneOf:
          - type: string
          - type: integer
        generatedAt:
          type: string
          format: date-time
          description: When this projection was built.
        trackingSince:
          type: string
          description: Start of the i6eal observation period — distinct from the coverage of the underlying sources.
        methodology:
          type: object
          description: How the dataset is collected and what it does and does not claim.
        downloads:
          type: object
          additionalProperties:
            type: string
          description: Named paths of sibling distributions published with this dataset.
      additionalProperties: true
  responses:
    NotFound:
      description: No distribution exists at this path.
externalDocs:
  description: Open data hub, licensing and citation guidance
  url: https://i6eal.de/tools/daten/
