openapi: 3.2.0
info:
  title: i6eal Open AI Data German Federal AI Budget Monitor API
  version: 1.0.0
  description: Open datasets on artificial intelligence in Germany and the EU — public procurement, federal budget lines, case law, supervision, standardisation, medical devices, enforcement and more.
  termsOfService: https://i6eal.de/tools/daten/
  contact:
    name: i6eal
    url: https://i6eal.de/kontakt/
    email: ai@i6eal.de
  license:
    name: CC BY 4.0 — i6eal compilation only; source records retain source-specific rights
    url: https://i6eal.de/tools/daten/
  x-logo:
    url: https://i6eal.de/publisher-logo.png
    altText: i6eal
servers:
- url: https://i6eal.de
  description: Production — static files behind CloudFront
security: []
tags:
- name: German Federal AI Budget Monitor
  description: Machine-readable federal budget titles with explicit AI references, keeping appropriations, supplements, actuals and official revisions separate.
  externalDocs:
    description: Dataset documentation and methodology
    url: https://i6eal.de/tools/ki-haushaltsmonitor/
paths:
  /data/ki-haushaltsmonitor/index.json:
    get:
      tags:
      - German Federal AI Budget Monitor
      operationId: getFederalAiBudgetMonitorIndex
      summary: Full dataset — German Federal AI Budget Monitor
      description: 'Machine-readable federal budget titles with explicit AI references, keeping appropriations, supplements, actuals and official revisions separate.


        Attribution: i6eal compilation based on official German federal budget data.


        Reuse: The machine-readable budget documents remain subject to the notices and terms of the federal budget portal.'
      responses:
        '200':
          description: Full dataset of German Federal AI Budget Monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetIndex'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-haushaltsmonitor/titles.csv:
    get:
      tags:
      - German Federal AI Budget Monitor
      operationId: getFederalAiBudgetMonitorTitles
      summary: Budget titles — German Federal AI Budget Monitor
      description: 'Machine-readable federal budget titles with explicit AI references, keeping appropriations, supplements, actuals and official revisions separate.


        Attribution: i6eal compilation based on official German federal budget data.


        Reuse: The machine-readable budget documents remain subject to the notices and terms of the federal budget portal.'
      responses:
        '200':
          description: Budget titles of German Federal AI Budget Monitor.
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/CsvTable'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-haushaltsmonitor/series.csv:
    get:
      tags:
      - German Federal AI Budget Monitor
      operationId: getFederalAiBudgetMonitorSeries
      summary: Time series — German Federal AI Budget Monitor
      description: 'Machine-readable federal budget titles with explicit AI references, keeping appropriations, supplements, actuals and official revisions separate.


        Attribution: i6eal compilation based on official German federal budget data.


        Reuse: The machine-readable budget documents remain subject to the notices and terms of the federal budget portal.'
      responses:
        '200':
          description: Time series of German Federal AI Budget Monitor.
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/CsvTable'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-haushaltsmonitor/revisions.csv:
    get:
      tags:
      - German Federal AI Budget Monitor
      operationId: getFederalAiBudgetMonitorRevisions
      summary: Revisions — German Federal AI Budget Monitor
      description: 'Machine-readable federal budget titles with explicit AI references, keeping appropriations, supplements, actuals and official revisions separate.


        Attribution: i6eal compilation based on official German federal budget data.


        Reuse: The machine-readable budget documents remain subject to the notices and terms of the federal budget portal.'
      responses:
        '200':
          description: Revisions of German Federal AI Budget Monitor.
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/CsvTable'
        '404':
          $ref: '#/components/responses/NotFound'
  /data/ki-haushaltsmonitor/methodology.json:
    get:
      tags:
      - German Federal AI Budget Monitor
      operationId: getFederalAiBudgetMonitorMethodology
      summary: Methodology — German Federal AI Budget Monitor
      description: 'Machine-readable federal budget titles with explicit AI references, keeping appropriations, supplements, actuals and official revisions separate.


        Attribution: i6eal compilation based on official German federal budget data.


        Reuse: The machine-readable budget documents remain subject to the notices and terms of the federal budget portal.'
      responses:
        '200':
          description: Methodology of German Federal AI Budget Monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResource'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    DatasetResource:
      type: object
      description: A dataset-specific JSON document. See the dataset entry in the DCAT catalogue for its shape.
      additionalProperties: true
    CsvTable:
      type: string
      description: RFC 4180 CSV with a header row, UTF-8 encoded.
    DatasetIndex:
      type: object
      description: Every dataset index shares the envelope below. The remaining top-level keys are dataset-specific — consult the `methodology` block and the dataset entry in the DCAT catalogue.
      required:
      - schemaVersion
      properties:
        schemaVersion:
          description: Payload contract of this dataset. Changes only on a breaking shape change.
          oneOf:
          - type: string
          - type: integer
        generatedAt:
          type: string
          format: date-time
          description: When this projection was built.
        trackingSince:
          type: string
          description: Start of the i6eal observation period — distinct from the coverage of the underlying sources.
        methodology:
          type: object
          description: How the dataset is collected and what it does and does not claim.
        downloads:
          type: object
          additionalProperties:
            type: string
          description: Named paths of sibling distributions published with this dataset.
      additionalProperties: true
  responses:
    NotFound:
      description: No distribution exists at this path.
externalDocs:
  description: Open data hub, licensing and citation guidance
  url: https://i6eal.de/tools/daten/
